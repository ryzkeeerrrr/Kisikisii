<style>

</style></head><body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;
const API_URL="https://script.google.com/macros/s/AKfycbynTghJuXip_yf3ypWpUBb0yjYLcaMm_-Ca8SSuYOm-dXWzlA10WU_m8DR8e2K_iso/exec"; // URL Web App Apps Script (.../exec)

const toItems=d=>[...d.KISI_KISI.map(r=>({id:r.ID,type:'soal',title:r.Judul,cat:r.Kategori,q:r.Pertanyaan,a:r.Jawaban,p:r.Pembahasan,kw:r.Kata_Kunci,src:r.Sumber,date:r.Tanggal,raw:r})),
 ...d.MATERI.map(r=>({id:r.ID,type:'materi',title:r.Judul,cat:r.Kategori,q:r.Isi_Materi,kw:r.Kata_Kunci,src:r.Sumber,date:r.Tanggal,raw:r}))];
const STOP=new Set('yang dan di ke dari untuk dengan atau pada adalah ini itu dalam akan oleh sebagai juga tidak dapat ada bagi para bila jika maka serta saat atas bawah dibawah diatas berikut termasuk apa apakah mana kapan siapa bagaimana'.split(' '));
function search(items,query,cat){

      if(h){m++;s+=h}}

const Hl=({text,q})=>{const t=norm(q).split(' ').filter(Boolean).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));

function ItemCard({it,q}){
  const kws=String(it.kw||'').split(/[,;]/).map(x=>x.trim()).filter(Boolean);
  return <div className="card qc mb-3">
    <div className="flex items-center gap-3"><div className={'qbadge '+(it.type==='soal'?'':'m')}>{it.type==='soal'?'Q':'M'}</div>
      <div className="min-w-0 flex-1"><span className="tag">{it.cat}</span></div><span className="sm text-xs">#{it.id}</span></div>
    <h3 className="pf text-[17px] mt-3 leading-snug"><Hl text={it.title} q={q}/></h3>
    <p className="mt-2 whitespace-pre-wrap text-[15px] leading-relaxed" style={{color:'var(--text)'}}><Hl text={it.q} q={q}/></p>
    {it.type==='soal'&&<div className="ans mt-4"><div className="ans-h"><span className="ans-ic"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>JAWABAN</div><p className="whitespace-pre-wrap">{it.a}</p></div>}
    {(kws.length>0||it.src)&&<div className="flex flex-wrap items-center gap-1.5 mt-3">{kws.map(k=><span key={k} className="chip">#{k}</span>)}{it.src&&<span className="sm text-[11px] ml-auto">Sumber: {it.src}</span>}</div>}</div>;

function Practice({items,cats,toast,reload}){
  const [cat,setCat]=useState(''),[n,setN]=useState(5),[deck,setDeck]=useState(null),[i,setI]=useState(0),[show,setShow]=useState(false),[hard,setHard]=useState({}),[ok,setOk]=useState({}),[done,setDone]=useState(false);
  const pool=items.filter(x=>x.type==='soal'&&(!cat||x.cat===cat));
  const start=()=>{if(!pool.length)return toast('Tidak ada soal');setDeck([...pool].sort(()=>Math.random()-.5).slice(0,n));setI(0);setShow(false);setHard({});setOk({});setDone(false)};
  const finish=async()=>{setDone(true);try{await api('add',{table:'RIWAYAT',record:{Kategori:cat||'Semua',Jumlah:deck.length,Benar:Object.values(ok).filter(Boolean).length,Sulit:Object.keys(hard).filter(k=>hard[k]).length}});await reload();toast('Riwayat tersimpan di server')}catch(e){toast('Gagal simpan riwayat: '+e.message)}};

}

function Admin({data,items,toast,reload}){
  const [key,setKey]=useState(''),[auth,setAuth]=useState(false),[tab,setTab]=useState('KISI_KISI'),[f,setF]=useState({}),[eid,setEid]=useState(null),[busy,setBusy]=useState(false);

function Login({onOk}){

    <input inputMode="numeric" placeholder="NIK" value={nik} onChange={e=>setNik(e.target.value)}/>

function App(){
  const [tab,setTab]=useState('search'),[data,setData]=useState(null),[err,setErr]=useState(null),[sync,setSync]=useState(null),[q,setQ]=useState(''),[dq,setDq]=useState(''),[cat,setCat]=useState(''),[msg,setMsg]=useState(''),[hist,setHist]=useState([]),[pg,setPg]=useState(1),[dark,setDark]=useState(()=>matchMedia('(prefers-color-scheme: dark)').matches),[mode,setMode]=useState('list'),[inst,setInst]=useState(null),[user,setUser]=useState('Saya');
  useEffect(()=>{const h=e=>{e.preventDefault();setInst(e)};addEventListener('beforeinstallprompt',h);return()=>removeEventListener('beforeinstallprompt',h)},[]);
  const toast=m=>{setMsg(m);setTimeout(()=>setMsg(''),2500)};
  const reload=async()=>{try{const j=await api('all');setData(j.data);setSync(new Date());setErr(null)}catch(e){setErr(e.message||'Server tidak dapat diakses')}};
  useEffect(()=>{if(!user)return;reload();const o=()=>reload();addEventListener('online',o);return()=>removeEventListener('online',o)},[user]);
    useEffect(()=>{document.body.classList.toggle('dk',dark)},[dark]);
  const items=useMemo(()=>data?toItems(data):[],[data]);
  const favIds=useMemo(()=>new Set((data?.FAVORIT||[]).map(f=>f.ID_Item)),[data]);
  const cats=useMemo(()=>{if(!data)return [];const names=data.KATEGORI.map(c=>c.Nama_Kategori);const cnt={};items.forEach(i=>{if(i.cat)cnt[i.cat]=(cnt[i.cat]||0)+1});const all=[...names,...Object.keys(cnt).filter(c=>!names.includes(c))];return all.map((c,k)=>[c,k]).sort((x,y)=>(cnt[y[0]]||0)-(cnt[x[0]]||0)||x[1]-y[1]).map(x=>x[0])},[data,items]);
  const res=useMemo(()=>search(items,dq,cat),[items,dq,cat]);
  const toggleFav=async it=>{try{if(favIds.has(it.id)){const f=data.FAVORIT.find(x=>x.ID_Item===it.id);await api('remove',{table:'FAVORIT',id:f.ID})}else await api('add',{table:'FAVORIT',record:{ID_Item:it.id,Jenis_Item:it.type}});await reload()}catch(e){toast('Gagal: '+e.message)}};
  if(!user)return <Login onOk={setUser}/>;
  if(API_URL.startsWith('PASTE'))return <Screen title="URL belum diatur" body="Isi konstanta API_URL di index.html dengan URL Web App Apps Script."/>;
  if(err&&!data||(err&&!navigator.onLine))return <Screen title="Koneksi terputus" body="VFT membutuhkan internet dan server. Data lama tidak ditampilkan." retry={reload} detail={err}/>;
  if(!data)return <Loader/>;
  const list=(arr,showQ)=>{const s=arr.slice(0,pg*20);return <>{s.length?s.map(i=><ItemCard key={i.id} it={i} q={showQ}/>):<p className="card p-4 text-center sm">Tidak ada hasil. Coba kata lain atau ganti kategori.</p>}{arr.length>s.length&&<button className="btn w-full" onClick={()=>setPg(pg+1)}>Muat lebih banyak</button>}</>};
  const submit=()=>{const v=q.trim();if(!v)return;setDq(v);setPg(1);setQ('');setHist(h=>[v,...h.filter(x=>x!==v)].slice(0,6));if(tab==='home')setTab('search')};
  const SearchBox=<div><div className="flex gap-2"><input style={{borderRadius:12}} enterKeyHint="search" placeholder="Ketik atau paste soal, lalu kirim" value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')submit()}}/><button className="btn text-lg px-4" onClick={submit} aria-label="Cari">➤</button></div>
    {dq&&<button className="btn btn2 mt-2" onClick={()=>{setDq('');setPg(1)}}>✕ Hapus hasil</button>}
    {hist.length>0&&<div className="flex gap-1.5 flex-wrap mt-2">{hist.map(h=><button key={h} className="tag" onClick={()=>{setDq(h);setPg(1);if(tab==='home')setTab('search')}}>{h.slice(0,24)}</button>)}</div>}</div>;
  const favItems=items.filter(i=>favIds.has(i.id));
  return <div className="max-w-xl mx-auto px-4 pb-32">
    <header className="flex items-center gap-3 pt-2 pb-4 mb-1"><div className="hero w-11 h-11 shrink-0 flex items-center justify-center pf text-sm" style={{background:'#FFD23F',transform:'rotate(-4deg)'}}>VFT</div><div><h1 className="pf text-xl font-extrabold leading-tight">Vitamin Funcional Test</h1><p className="sm text-xs">Your knowledge archive</p></div></header>
    {msg&&<div className="fixed top-3 left-1/2 -translate-x-1/2 z-50 card px-4 py-2 text-sm font-semibold">{msg}</div>}
    {tab==='home'&&<>
      <div className="hero p-5 mb-4"><p className="sm text-xs" style={{color:'#1B1F3B'}}>HALO 👋</p><h2 className="pf text-2xl leading-tight mb-3">Mau belajar apa hari ini?</h2><div>{SearchBox}</div></div>
      <div className="grid grid-cols-3 gap-2 my-3 text-center">{[['Kisi-kisi',data.KISI_KISI.length],['Materi',data.MATERI.length],['Kategori',cats.length]].map(([l,v])=><div key={l} className="card p-3"><div className="pf text-2xl font-extrabold title-grad">{v}</div><div className="text-xs sm">{l}</div></div>)}</div>
      <p className="sm text-xs mb-3 flex items-center gap-2"><span className="dot"></span> Server terhubung | sinkron {sync?.toLocaleTimeString('id-ID')}</p>
      <button className="btn w-full mb-3" onClick={()=>setTab('latihan')}>Mulai mode latihan</button>
      <h2 className="pf text-xl font-bold mb-3">Terbaru</h2>{list([...items].reverse().slice(0,5),'')}</>}
    {tab==='search'&&<>{SearchBox}<select className="my-3" value={cat} onChange={e=>setCat(e.target.value)}><option value="">Semua kategori</option>{cats.map(c=><option key={c}>{c}</option>)}</select>
      <p className="sm text-xs mb-2">{res.length} hasil{dq?' untuk: '+dq.slice(0,60)+(dq.length>60?'…':''):''}</p>{list(res,dq)}{dq&&res.length===0&&<div className="card p-6 mt-3 text-center"><p className="pf text-xl font-extrabold stamp inline-block px-4 py-2 -rotate-2">GAK ADA JAWABAN, MIKIR SENDIRI! 😆</p></div>}</>}
    {tab==='kategori'&&<><h2 className="pf text-xl font-bold mb-3">Kategori</h2>{cats.map(c=><button key={c} className="card p-4 mb-2 w-full text-left flex justify-between items-center gap-3" onClick={()=>{setCat(c);setQ('');setTab('search')}}><span>{c}<br/><span className="sm text-xs opacity-70">{(data.KATEGORI.find(k=>k.Nama_Kategori===c)||{}).Deskripsi}</span></span><span className="tag">{items.filter(i=>i.cat===c).length}</span></button>)}</>}
    {tab==='favorit'&&<><h2 className="pf text-xl font-bold mb-3">Favorit</h2>{SearchBox}<div className="mt-2">{list(search(favItems,dq,''),dq)}</div></>}
    {tab==='latihan'&&<Practice items={items} cats={cats} toast={toast} reload={reload}/>}
    {tab==='setelan'&&<><div className="card p-4"><h2 className="pf text-xl font-bold">Pengaturan</h2>
      <p className="sm text-xs break-all mt-2">API: {API_URL}</p>
      <div className="flex flex-wrap gap-2 mt-2"><button className="btn" onClick={async()=>{try{await api('ping');toast('Server OK')}catch(e){toast('Server tidak terjangkau')}}}>Tes koneksi</button><button className="btn btn2" onClick={async()=>{await reload();toast('Disinkronkan')}}>Sinkronkan</button><button className="btn btn2" onClick={()=>setDark(!dark)}>{dark?'Terang':'Gelap'}</button>{inst&&<button className="btn" onClick={()=>inst.prompt()}>Pasang aplikasi</button>}</div>
      <p className="sm text-xs mt-2">Versi 1.0 | Riwayat latihan: {data.RIWAYAT.length}</p></div>
      <Admin data={data} items={items} toast={toast} reload={reload}/></>}
    <nav className="fixed bottom-0 inset-x-0 z-40 px-6 pointer-events-none" style={{paddingBottom:'max(1rem,env(safe-area-inset-bottom))'}}>
      <div className="nav-pill pointer-events-auto max-w-xs mx-auto grid grid-cols-3 gap-1 p-1.5">
      {[['search','Cari',<><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></>],['kategori','Kategori',<><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></>],['setelan','Setelan',<><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></>]].map(([k,l,ic])=>
        <button key={k} onClick={()=>{setTab(k);setPg(1)}} className={'navb flex flex-col items-center gap-0.5 py-2 text-[11px] font-semibold '+(tab===k?'on':'')}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">{ic}</svg>{l}</button>)}
      </div></nav></div>;
}
function Loader(){
  const msgs=['Menyiapkan kisi-kisi…','Mengambil soal & jawaban…','Merapikan kartu…','Hampir siap!'];
  const [i,setI]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setI(x=>(x+1)%msgs.length),1500);return()=>clearInterval(t)},[]);
  return <div className="ld" role="status" aria-live="polite">
    <span className="ld-sh a"/><span className="ld-sh b"/><span className="ld-sh c"/><span className="ld-sh d"/>
    <div className="ld-keys"><div className="ld-key">V</div><div className="ld-key">F</div><div className="ld-key">T</div></div>
    <div className="ld-bar"><div className="ld-fill"/></div>
    <p key={i} className="ld-msg">{msgs[i]}</p>
  </div>;
}
function Screen({title,body,retry,detail}){return <div className="min-h-screen flex items-center justify-center p-6 text-center"><div className="card p-6"><h1 className="pf text-2xl font-bold title-grad">{title}</h1><p className="mt-2">{body}</p>{detail&&<p className="sm text-xs mt-1 text-[#E8344E]">{detail}</p>}{retry&&<button className="btn mt-3" onClick={retry}>Coba Lagi</button>}</div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
